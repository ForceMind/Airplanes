name: Inspect combat upstream
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/upstream-capture.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download exact public sources without executing them
        shell: python
        run: |
          import urllib.request, urllib.parse, hashlib, pathlib, json, re, tarfile, time
          out = pathlib.Path('upstream-review'); out.mkdir(exist_ok=True)
          sources = [('sharehtml', 'https://2kp1v13.sharehtml.org/'), ('forge', 'https://forge.ui8.ai/share/frag_2a9b059a-aeb6-4aea-a447-668efb59bd3e')]
          report = []
          for name, start in sources:
              queue = [(start, name + '.html', 0)]; seen = set(); total = 0
              while queue and len(seen) < 20 and total < 20000000:
                  url, path, depth = queue.pop(0)
                  if url in seen: continue
                  seen.add(url)
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 Airplanes-source-review'})
                      with urllib.request.urlopen(req, timeout=35) as response:
                          data = response.read(6000001)
                          if len(data) > 6000000: raise ValueError('source size limit')
                          final = response.geturl()
                          typ = response.headers.get('Content-Type', '')
                      total += len(data)
                      (out / path).write_bytes(data)
                      text = data.decode('utf-8', errors='replace')
                      refs = re.findall(r'(?:src|href)=[\"\']([^\"\']+)[\"\']', text) if depth == 0 else []
                      entry = {'url': url, 'finalUrl': final, 'path': path, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest(), 'contentType': typ, 'references': refs}
                      report.append(entry)
                      print(json.dumps({k:v for k,v in entry.items() if k != 'references'}))
                      print('TITLE', re.findall(r'<title>(.*?)</title>', text, re.S)[:1])
                      print('REFERENCES', json.dumps(refs)[:8000])
                      if depth == 0:
                          for ref in refs:
                              absolute = urllib.parse.urljoin(final, ref)
                              parsed = urllib.parse.urlparse(absolute)
                              if parsed.hostname == urllib.parse.urlparse(final).hostname and parsed.path.endswith(('.js','.mjs','.ts','.tsx','.css')):
                                  queue.append((absolute, name + '-' + pathlib.PurePosixPath(parsed.path).name, depth+1))
                  except Exception as error:
                      print('FETCH ERROR', url, repr(error)); report.append({'url':url,'error':str(error)})
          (out / 'report.json').write_text(json.dumps(report, indent=2))
          with tarfile.open('/tmp/airplanes-source-review.tar.gz', 'w:gz') as archive:
              for path in pathlib.Path('.').iterdir():
                  if path.name not in ('.git', 'node_modules', 'test-results', 'dist'):
                      archive.add(path, arcname=path.name)
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: airplanes-source-review
          path: /tmp/airplanes-source-review.tar.gz
          retention-days: 3
